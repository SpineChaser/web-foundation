
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>QuickNotes</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <label for="note-input">New note</label>
          <input
            type="text"
            id="note-input"
            placeholder="Type a note..."
          />
          <button type="submit">Add Note</button>
        </form>
      </section>

      <section>
        <h2>Your notes</h2>
        <p id="note-count">You have 5 notes.</p>
        <ul id="notes-list">
          <li>Buy milk and bread</li>
          <li>Finish the Day 3 assignment</li>
          <li>Email the project report to Grace</li>
          <li>Revise JavaScript arrays</li>
          <li>Call mum</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
